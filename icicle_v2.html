    <style>
        :root {
            --bg-deep: #0a0a0f;
            --bg-surface: #12121a;
            --bg-elevated: #1a1a24;
            --neon-cyan: #00f5ff;
            --neon-magenta: #ff00aa;
            --neon-lime: #b8ff00;
            --neon-orange: #ff6b35;
            --text-primary: #ffffff;
            --text-secondary: #8a8a9a;
            --glow-cyan: 0 0 20px rgba(0, 245, 255, 0.5);
            --glow-magenta: 0 0 20px rgba(255, 0, 170, 0.5);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1;
        }
        .header {
            position: relative;
            z-index: 10;
            padding: 40px 60px;
            background: linear-gradient(180deg, var(--bg-surface) 0%, transparent 100%);
            border-bottom: 1px solid rgba(0, 245, 255, 0.1);
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
        }
        .title-wrapper {
            display: flex;
            align-items: baseline;
            gap: 20px;
            margin-bottom: 16px;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(0, 245, 255, 0.3));
        }
        .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        .stats-bar {
            display: flex;
            gap: 40px;
            padding: 20px 0;
        }
        .stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: var(--glow-cyan);
        }
        .stat-value.accent {
            color: var(--neon-magenta);
            text-shadow: var(--glow-magenta);
        }
        .chart-container {
            position: relative;
            z-index: 5;
            padding: 20px;
            min-height: calc(100vh - 200px);
            overflow: auto;
        }
        #chart {
            width: 100%;
            height: calc(100vh - 200px);
        }
        #chart svg {
            display: block;
        }
        .node rect {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .node rect:hover {
            filter: brightness(1.3) drop-shadow(0 0 15px currentColor);
            z-index: 100;
        }
        .node {
            cursor: pointer;
        }
        .node text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            fill: var(--text-primary);
            pointer-events: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .node:hover text { opacity: 1; }
        .tooltip {
            position: fixed;
            background: var(--bg-elevated);
            border: 1px solid var(--neon-cyan);
            padding: 16px 20px;
            border-radius: 4px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 1000;
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.3), inset 0 0 20px rgba(0, 245, 255, 0.05);
            backdrop-filter: blur(10px);
            min-width: 220px;
            max-width: 300px;
        }
        .tooltip.visible { opacity: 1; transform: scale(1.02); }
        .tooltip-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--neon-cyan);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 245, 255, 0.2);
        }
        .tooltip-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0;
        }
        .tooltip-label {
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .tooltip-value { font-weight: 500; color: var(--text-primary); }
        .tooltip-value.size { color: var(--neon-lime); }
        .tooltip-value.percent { color: var(--neon-orange); }
        .legend {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-surface);
            border: 1px solid rgba(0, 245, 255, 0.2);
            padding: 16px 20px;
            border-radius: 4px;
            z-index: 100;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }
        .legend:hover { opacity: 1; }
        .legend-title {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
            font-size: 11px;
        }
        .legend-color { width: 14px; height: 14px; border-radius: 2px; }

        /* File Type Stats Panel */
        .stats-panel {
            position: fixed;
            top: 30px;
            right: 30px;
            background: var(--bg-surface);
            border: 1px solid rgba(0, 245, 255, 0.2);
            padding: 0;
            border-radius: 4px;
            z-index: 100;
            width: 280px;
            max-height: calc(100vh - 200px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .stats-panel-header {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(0, 245, 255, 0.1);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .stats-panel-header:hover {
            background: rgba(0, 245, 255, 0.05);
        }
        .stats-panel-title {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .stats-panel-toggle {
            color: var(--neon-cyan);
            font-size: 12px;
            transition: transform 0.3s;
        }
        .stats-panel.collapsed .stats-panel-toggle {
            transform: rotate(180deg);
        }
        .stats-panel-content {
            padding: 12px 16px;
            overflow-y: auto;
            flex: 1;
        }
        .stats-panel.collapsed .stats-panel-content {
            display: none;
        }
        .file-type-row {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .file-type-row:last-child {
            border-bottom: none;
        }
        .file-type-ext {
            font-weight: 500;
            color: var(--neon-cyan);
            min-width: 50px;
        }
        .file-type-bar {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin: 0 10px;
            overflow: hidden;
        }
        .file-type-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .file-type-count {
            font-size: 11px;
            color: var(--text-secondary);
            min-width: 45px;
            text-align: right;
        }
        .file-type-size {
            font-size: 11px;
            color: var(--neon-lime);
            min-width: 70px;
            text-align: right;
        }

        /* Filter controls */
        .filter-section {
            padding: 12px 16px;
            border-top: 1px solid rgba(0, 245, 255, 0.1);
        }
        .filter-label {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }
        .filter-input {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid rgba(0, 245, 255, 0.2);
            border-radius: 4px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        .filter-input:focus {
            border-color: var(--neon-cyan);
        }
        .filter-hint {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .scanline {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(transparent 50%, rgba(0, 245, 255, 0.02) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
            opacity: 0.3;
        }
        .node rect {
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 768px) {
            .header { padding: 20px 30px; }
            h1 { font-size: 1.5rem; }
            .stats-bar { gap: 20px; }
            .stat-value { font-size: 1.1rem; }
            .chart-container { padding: 20px; }

    </style>
